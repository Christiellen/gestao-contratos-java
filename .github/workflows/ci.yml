name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (Java 21 + Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Testes de unidade (Surefire) e de integração (Failsafe). Os de integração sobem um
      # PostgreSQL 16 com Testcontainers e aplicam as migrations do Flyway.
      - name: Testes
        run: mvn -B verify

      - name: Relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-api
          path: backend/target/site

  web:
    name: Front-end (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx ng build --configuration production
      - run: npm run test:ci
